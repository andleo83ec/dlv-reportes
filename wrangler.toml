# DLV Plataforma (pantallas + funciones) como Worker de Cloudflare.
# Cloudflare → Workers & Pages → Create application → Connect GitHub → dlv-reportes (sin cambiar la carpeta raíz).
# El servicio de facturas y WhatsApp es otro Worker, en la carpeta worker/ (tiene su propio wrangler.toml).
name = "dlv-plataforma"
main = "plataforma.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Fotos, modelos IFC, documentos (mismo bucket que usa el servicio de integraciones)
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "dlv-fotos"

