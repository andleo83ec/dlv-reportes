<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estado de pago · DLV</title>
<meta name="theme-color" content="#1d3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DLV">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/planillas.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="brand">
      <div class="logo"><b>DLV</b><span>Estado de pago</span></div>
      <div class="user"><a class="btn sm" href="/">Menú DLV</a><span id="quien"></span></div>
    </div>
    <div class="obra-row">
      <label class="fld" for="obraSel"><span>Obra</span><select id="obraSel"><option value="">Cargando obras…</option></select></label>
    </div>
  </header>
  <main id="main"><div class="empty">Cargando…</div></main>
</div>
<div class="dock" id="dock" hidden><div class="in">
  <button class="btn ghost" id="btnVolver" type="button">← Planillas</button>
  <span class="state" id="estado"></span>
  <button class="btn" id="btnPDF" type="button">PDF</button>
  <button class="btn primary" id="btnGuardar" type="button">Guardar</button>
</div></div>
<div class="toast" id="toast" hidden></div>
<script src="/planillas.js"></script>
</body>
</html>
